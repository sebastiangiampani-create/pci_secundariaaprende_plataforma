name: Bootstrap r37 estable

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-r37:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Importar snapshot r37
        shell: bash
        run: |
          set -euo pipefail
          SRC_DIR="$(mktemp -d)/source"
          git clone https://github.com/sebastiangiampani-create/pci_secundaria_aprende.git "$SRC_DIR"
          git -C "$SRC_DIR" checkout b923b9bb06863e7325488bf00a846aed99dc67fe
          rm -rf "$SRC_DIR/.git"
          rm -f "$SRC_DIR/.github/workflows/browser-js-check.yml"

          cp -a "$SRC_DIR/." "$GITHUB_WORKSPACE/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios para importar"
            exit 0
          fi

          git commit -m "Inicializar plataforma desde r37 estable"
          git push origin HEAD:main
